<section class="market-section">
  <div class="market-section-head">
    <div><h2>{{ rail_title }}</h2>{% if rail_subtitle %}<p>{{ rail_subtitle }}</p>{% endif %}</div>{% if rail_collection %}<a class="market-see-all" href="{% url 'product_collection' rail_collection %}"><span>See all</span><span class="market-see-all-icon"><i class="fa-solid fa-arrow-right"></i></span></a>{% endif %}
  </div>
  <div class="market-product-rail">
    {% for product in rail_products %}
      {% include 'core_app/includes/product_card.html' %}
    {% endfor %}
  </div>
</section>

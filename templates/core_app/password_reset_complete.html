{% extends 'base.html' %}
{% block title %}Password Updated{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card neon-login-card">
    <div class="section-head"><h3>Password updated</h3><span class="pill">Complete</span></div>
    <p class="muted">Your password has been changed successfully. You can now sign in with your new password.</p>
    <a class="btn btn-primary" href="{% url 'login' %}">Sign in</a>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}QA Dashboard{% endblock %}
{% block content %}
<div class="card"><div class="section-head"><h3>QA Queue</h3><span class="pill">Inspection</span></div><div class="stack-list">{% for order in orders %}<a class="list-card" href="{% url 'qa_order_review' order.id %}"><div><h4>Order #{{ order.id }}</h4><p>{{ order.delivery_address }}</p></div><span class="pill">{{ order.get_status_display }}</span></a>{% empty %}<div class="empty-state">No orders in the QA queue.</div>{% endfor %}</div></div>
{% endblock %}

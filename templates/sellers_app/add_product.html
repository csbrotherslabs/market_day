{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="card">
  <div class="section-head"><h3>Add product</h3><span class="pill">Seller</span></div>
  {% if stores %}
    <form method="POST" enctype="multipart/form-data" class="form-grid two-col-form">
      {% csrf_token %}
      <label>
        <span>Store</span>
        <select name="store" required>
          <option value="">Select store</option>
          {% for store in stores %}
            <option value="{{ store.id }}">{{ store.name }}{% if store.market %} · {{ store.market.name }}{% endif %}</option>
          {% endfor %}
        </select>
      </label>
      <label><span>Name</span><input type="text" name="name" required></label>
      <label><span>Price</span><input type="number" step="0.01" min="0" name="price" required></label>
      <label><span>Unit</span><input type="text" name="unit" value="piece"></label>
      <label><span>Available qty</span><input type="number" min="0" name="available_qty" value="0"></label>
      <label><span>Category</span><select name="category"><option value="">Select category</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label>
      <label><span>Image</span><input type="file" name="image" accept="image/*"></label>
      <label class="full-span"><span>Description</span><textarea name="description" rows="4"></textarea></label>
      <div class="full-span"><button class="btn btn-primary" type="submit">Create product</button></div>
    </form>
  {% else %}
    <div class="empty-state">Create a store before adding your first product.</div>
    <div class="hero-actions" style="margin-top:16px;"><a class="btn btn-primary" href="{% url 'seller_store_setup' %}">Create store</a></div>
  {% endif %}
</div>
{% endblock %}

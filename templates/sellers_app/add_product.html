{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="card"><div class="section-head"><h3>Add product</h3><span class="pill">Seller</span></div><form method="POST" enctype="multipart/form-data" class="form-grid two-col-form">{% csrf_token %}<label><span>Name</span><input type="text" name="name" required></label><label><span>Price</span><input type="number" step="0.01" name="price" required></label><label><span>Unit</span><input type="text" name="unit" value="piece"></label><label><span>Available qty</span><input type="number" name="available_qty" value="0"></label><label><span>Category</span><select name="category"><option value="">Select category</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label><span>Image</span><input type="file" name="image"></label><label class="full-span"><span>Description</span><textarea name="description" rows="4"></textarea></label><div class="full-span"><button class="btn btn-primary" type="submit">Create product</button></div></form></div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="card"><div class="section-head"><h3>Edit product</h3><span class="pill">Seller</span></div><form method="POST" enctype="multipart/form-data" class="form-grid two-col-form">{% csrf_token %}<label><span>Name</span><input type="text" name="name" value="{{ product.name }}" required></label><label><span>Price</span><input type="number" step="0.01" name="price" value="{{ product.price }}" required></label><label><span>Unit</span><input type="text" name="unit" value="{{ product.unit }}"></label><label><span>Available qty</span><input type="number" name="available_qty" value="{{ product.available_qty }}"></label><label><span>Category</span><select name="category"><option value="">Select category</option>{% for category in categories %}<option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label><span>Image</span><input type="file" name="image"></label><label class="full-span"><span>Description</span><textarea name="description" rows="4">{{ product.description }}</textarea></label><label class="checkbox-row full-span"><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Active</label><div class="full-span"><button class="btn btn-primary" type="submit">Save changes</button></div></form></div>
{% endblock %}

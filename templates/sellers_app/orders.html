{% extends 'base.html' %}
{% block title %}Seller Orders{% endblock %}
{% block content %}<div class='card'><div class='section-head'><h3>Incoming orders</h3><span class='pill'>Seller</span></div><div class='stack-list'>{% for order in orders %}<a class='list-card' href='{% url "seller_order_detail" order.id %}'><div><h4>Order #{{ order.id }}</h4><p>{{ order.delivery_address }}</p></div><span class='pill'>{{ order.get_status_display }}</span></a>{% empty %}<div class='empty-state'>No orders found.</div>{% endfor %}</div></div>{% endblock %}

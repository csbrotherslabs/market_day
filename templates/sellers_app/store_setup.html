{% extends 'base.html' %}
{% block title %}{% if store %}Edit Store{% else %}Add Store{% endif %}{% endblock %}
{% block content %}
<div class="card">
  <div class="section-head">
    <h3>{% if store %}Edit store{% else %}Add store{% endif %}</h3>
    <span class="pill">Seller</span>
  </div>
  <form method="POST" enctype="multipart/form-data" class="form-grid two-col-form">
    {% csrf_token %}
    <label>
      <span>Store name</span>
      <input type="text" name="name" value="{% if store %}{{ store.name }}{% endif %}" required>
    </label>
    <label>
      <span>Market</span>
      <select name="market">
        <option value="">Select market</option>
        {% for market in markets %}
          <option value="{{ market.id }}" {% if store and store.market_id == market.id %}selected{% endif %}>{{ market.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Stall number</span>
      <input type="text" name="stall_number" value="{% if store %}{{ store.stall_number }}{% endif %}">
    </label>
    <label>
      <span>Store image</span>
      <input type="file" name="store_image" accept="image/*">
    </label>
    <label class="full-span">
      <span>Description</span>
      <textarea name="description" rows="4">{% if store %}{{ store.description }}{% endif %}</textarea>
    </label>
    {% if store %}
      <label class="checkbox-row full-span"><input type="checkbox" name="active" {% if store.active %}checked{% endif %}> Active store</label>
    {% endif %}
    <div class="full-span"><button class="btn btn-primary" type="submit">{% if store %}Save changes{% else %}Create store{% endif %}</button></div>
  </form>
</div>
{% endblock %}
